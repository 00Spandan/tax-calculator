services:
  tax-calculator:
    build:
      context: .
      dockerfile: services/tax-calculator/Dockerfile
    environment:
      PORT: 8080
    expose:
      - "8080"

  bff:
    build:
      context: .
      dockerfile: services/bff/Dockerfile
    environment:
      PORT: 8081
      TAX_CALCULATOR_GRPC_TARGET: tax-calculator:8080
    depends_on:
      - tax-calculator
    ports:
      - "8081:8081"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: 8080
      BFF_UPSTREAM: http://bff:8081
    depends_on:
      - bff
    ports:
      - "8080:8080"
