name: Tax Calculator CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'services/tax-calculator/**'
      - 'proto/**'
      - 'scripts/generate-proto.sh'
      - '.github/workflows/tax-calculator.yml'
  pull_request:
    paths:
      - 'services/tax-calculator/**'
      - 'proto/**'
      - 'scripts/generate-proto.sh'
      - '.github/workflows/tax-calculator.yml'

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: financial-tools-502613
  REGION: australia-southeast1
  REPOSITORY: financial-tools
  IMAGE_NAME: tax-calculator
  SERVICE_NAME: tax-calculator

jobs:
  tax-calculator:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend tooling
        run: npm ci --prefix frontend

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Generate protobuf code
        run: scripts/generate-proto.sh

      - name: Test
        working-directory: services/tax-calculator
        run: go test ./...

      - name: Build
        working-directory: services/tax-calculator
        run: go build ./cmd/server

      - name: Authenticate to Google Cloud
        if: github.event_name == 'push'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        if: github.event_name == 'push'
        uses: google-github-actions/setup-gcloud@v3

      - name: Configure Docker for Artifact Registry
        if: github.event_name == 'push'
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          docker build -f services/tax-calculator/Dockerfile -t "$IMAGE_TAG" .
          echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push "$IMAGE_TAG"

      - name: Deploy to Cloud Run
        if: github.event_name == 'push'
        run: |
          gcloud run deploy "$SERVICE_NAME" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE_TAG" \
            --allow-unauthenticated \
            --use-http2
