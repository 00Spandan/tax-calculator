name: Deploy to Cloud Run

on:
  push:
    branches: [main]

env:
  PROJECT_ID: financial-tools-502613
  REGION: australia-southeast1
  REPOSITORY: financial-tools
  IMAGE_NAME: tax-calculator
  SERVICE_NAME: tax-calculator

# Required for Workload Identity Federation (OIDC) auth to GCP
permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: echo "IMAGE_TAG=${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      # --- Auth ---
      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      # --- Build & push image ---
      - name: Build image
        working-directory: .
        run: docker build -t ${{ steps.vars.outputs.IMAGE_TAG }} .

      - name: Push image
        working-directory: .
        run: docker push ${{ steps.vars.outputs.IMAGE_TAG }}

      # --- Terraform ---
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Apply
        run: terraform apply -auto-approve -var="container_image=${{ steps.vars.outputs.IMAGE_TAG }}"